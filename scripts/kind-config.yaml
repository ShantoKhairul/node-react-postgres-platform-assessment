# kind cluster used for the whole assessment.
#  - the node is labelled ingress-ready so the ingress-nginx *kind* manifest
#    (Task 3) can bind it to host ports 80/443
#  - 80/443  -> Ingress controller  => http://node-react.local
#  - 30080   -> frontend NodePort   => http://localhost:30080
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
