apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dev
  labels:
    app: backend
    tier: api
spec:
  # No `replicas:` on purpose - the HorizontalPodAutoscaler (hpa-backend.yaml)
  # owns the count; a fixed value here would reset it on every `kubectl apply`.
  revisionHistoryLimit: 5 # keeps old ReplicaSets so `kubectl rollout undo` works
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below desired capacity during a rollout
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
      annotations:
        # Prometheus discovers pods through these (observability/prometheus.yaml).
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # Built locally and loaded into kind/minikube (scripts/kind-up.sh).
          # CI rewrites this to the registry image tagged <branch>-<short-sha>.
          image: node-react-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            # Simulated read/write cluster. $(VAR) is expanded by Kubernetes
            # from the env entries ABOVE it, so the password stays in the
            # Secret and never appears in a ConfigMap or in git.
            - name: DB_WRITE_URL # primary: every INSERT/UPDATE/DELETE
              value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres-service:5432/appdb
            - name: DB_READ_URL # replica: plain SELECTs
              value: postgres://$(DB_USER):$(DB_PASSWORD)@postgres-read-service:5432/appdb
          # Give a slow start up to 60s before liveness takes over.
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Liveness = "is the process alive?" Deliberately does NOT check the
          # database: a DB outage should take the pod out of rotation (readiness),
          # not restart every backend pod in a loop.
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Readiness = "can I serve traffic?" Checks the DB connection.
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests: # requests are required for CPU-based HPA (Task 6)
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000 # the "node" user in the image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
