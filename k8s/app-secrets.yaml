# DEV-ONLY placeholder credentials so the cluster works out of the box.
#
# Do NOT reuse these values anywhere real. For preprod/release the CI pipeline
# creates this Secret from GitHub environment secrets instead of applying this
# file (see Task 4). In a real cluster prefer Sealed Secrets, External Secrets
# Operator or SOPS so no plaintext ever sits in git.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dev
  labels:
    app.kubernetes.io/part-of: node-react-postgres
type: Opaque
stringData:
  DB_USER: appuser
  DB_PASSWORD: dev-only-change-me
