# The only externally exposed Service: NodePort 30080 for direct access (works
# without an Ingress). Task 3 puts an Ingress in front for the friendly
# hostname http://node-react.local.
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: dev
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
