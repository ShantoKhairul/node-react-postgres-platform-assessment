# OpenSearch in dev mode: single node, security plugin disabled, small heap.
# NEVER run this configuration outside a local cluster. It is kept internal
# (ClusterIP + NetworkPolicy) because it has no authentication.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: dev
  labels:
    app: search
    tier: platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
        tier: platform
    spec:
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.15.0
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: DISABLE_INSTALL_DEMO_CONFIG, value: "true"}
            - {name: bootstrap.memory_lock, value: "false"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms256m -Xmx256m"}
          ports:
            - name: http
              containerPort: 9200
          startupProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            periodSeconds: 5
            failureThreshold: 36 # up to 3 min: JVM start is slow
          readinessProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: "/_cluster/health?local=true", port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: {cpu: 200m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
      volumes:
        - name: data
          emptyDir: {} # dev only: search index is rebuilt from the queue/DB
