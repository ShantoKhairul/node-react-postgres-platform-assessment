# Prometheus (single replica, emptyDir storage - dev only) with:
#   * pod discovery: scrapes any pod annotated prometheus.io/scrape=true
#     (the backend, /metrics on :4000)
#   * the ingress-nginx controller (metrics on :10254)
#   * cAdvisor via the API server  -> container CPU / memory
#   * kube-state-metrics           -> replica counts, HPA state, restarts
#   * alert rules (evaluated here; routing to Slack/PagerDuty needs Alertmanager)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: backend            # annotated pods in any namespace
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app

      - job_name: ingress-nginx      # the controller exposes :10254/metrics
        kubernetes_sd_configs:
          - role: pod
            namespaces: {names: [ingress-nginx]}
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: ingress-nginx
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "10254"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      - job_name: cadvisor           # container CPU/memory, via the API server proxy
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

  alerts.yml: |
    groups:
      - name: backend
        rules:
          - alert: BackendHighErrorRate
            expr: |
              sum(rate(http_requests_total{app="backend",status=~"5.."}[5m]))
                / sum(rate(http_requests_total{app="backend"}[5m])) > 0.05
            for: 5m
            labels: {severity: page}
            annotations:
              summary: "More than 5% of backend requests are failing with 5xx"
          - alert: BackendHighLatencyP95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{app="backend"}[5m]))) > 0.5
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Backend p95 latency above 500ms for 10 minutes"
          - alert: BackendHighCPU
            expr: |
              sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="dev",container="backend"}[5m]))
                / sum by (pod) (kube_pod_container_resource_limits{namespace="dev",container="backend",resource="cpu"}) > 0.8
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Backend pod {{ $labels.pod }} is above 80% of its CPU limit (throttling imminent)"
          - alert: BackendHighMemory
            expr: |
              sum by (pod) (container_memory_working_set_bytes{namespace="dev",container="backend"})
                / sum by (pod) (kube_pod_container_resource_limits{namespace="dev",container="backend",resource="memory"}) > 0.85
            for: 10m
            labels: {severity: ticket}
            annotations:
              summary: "Backend pod {{ $labels.pod }} above 85% of its memory limit (OOMKill risk)"
          - alert: BackendDown
            expr: sum(up{job="backend",app="backend"}) == 0
            for: 1m
            labels: {severity: page}
            annotations:
              summary: "No backend pod is being scraped / reachable"
          - alert: BackendCrashLooping
            expr: increase(kube_pod_container_status_restarts_total{namespace="dev",container="backend"}[15m]) > 3
            labels: {severity: page}
            annotations:
              summary: "Backend container restarted more than 3 times in 15 minutes"
          - alert: BackendAtMaxReplicas
            expr: |
              kube_horizontalpodautoscaler_status_current_replicas{namespace="dev",horizontalpodautoscaler="backend-hpa"}
                == kube_horizontalpodautoscaler_spec_max_replicas{namespace="dev",horizontalpodautoscaler="backend-hpa"}
            for: 15m
            labels: {severity: ticket}
            annotations:
              summary: "Backend has been at max replicas for 15m - autoscaler cannot absorb more load"
      - name: ingress
        rules:
          - alert: IngressHigh5xx
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m]))
                / sum(rate(nginx_ingress_controller_requests[5m])) > 0.05
            for: 5m
            labels: {severity: page}
            annotations:
              summary: "More than 5% of requests at the gateway return 5xx"
          - alert: IngressRateLimiting
            expr: sum(rate(nginx_ingress_controller_requests{status="429"}[5m])) > 1
            for: 5m
            labels: {severity: info}
            annotations:
              summary: "Gateway is rate limiting >1 req/s: abuse, or limits set too low"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app: prometheus}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      securityContext: {runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - {name: http, containerPort: 9090}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
          livenessProbe:
            httpGet: {path: /-/healthy, port: http}
            initialDelaySeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels: {app: prometheus}
spec:
  type: ClusterIP
  selector: {app: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
