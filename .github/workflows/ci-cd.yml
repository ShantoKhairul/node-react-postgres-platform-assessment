name: CI/CD

# Branch -> environment (Kubernetes namespace)
#   master          -> dev
#   pre-release/v*  -> preprod
#   release/v*      -> release
on:
  push:
    branches: [master, "pre-release/v*", "release/v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback_namespace:
        description: "Namespace to roll back (dev|preprod|release)"
        required: true
      rollback_tag:
        description: "Image tag to roll back to (empty = kubectl rollout undo)"
        required: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Install, build & test
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Backend build validation (syntax) and tests
        working-directory: backend
        run: |
          for f in src/*.js; do node --check "$f"; done
          npm test

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend build
        run: npm run build
        working-directory: frontend

      - name: Validate Kubernetes manifests
        run: |
          pip install --quiet yamllint
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" k8s observability
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -ignore-missing-schemas -summary k8s

  build-and-push:
    name: Build & push images
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      namespace: ${{ steps.meta.outputs.namespace }}
      backend_image: ${{ steps.meta.outputs.backend_image }}
      frontend_image: ${{ steps.meta.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      # Tag = <branch-name>-<short-sha>  (slashes are illegal in image tags).
      # Every image is traceable to a branch + commit, and tags are immutable
      # by convention, which is what makes rollback-by-tag reliable.
      - name: Compute tag, namespace and image names
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          SAFE_BRANCH="${GITHUB_REF_NAME//\//-}"
          REPO="${GITHUB_REPOSITORY,,}"   # GHCR requires lowercase
          case "${GITHUB_REF_NAME}" in
            master)         NS=dev ;;
            pre-release/v*) NS=preprod ;;
            release/v*)     NS=release ;;
            *) echo "no environment for ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          {
            echo "tag=${SAFE_BRANCH}-${SHORT_SHA}"
            echo "namespace=${NS}"
            echo "backend_image=${REGISTRY}/${REPO}-backend"
            echo "frontend_image=${REGISTRY}/${REPO}-frontend"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is short-lived and scoped to this run: no long-lived
      # registry credential exists anywhere.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.backend_image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to ${{ needs.build-and-push.outputs.namespace }}
    if: github.event_name == 'push' && vars.DEPLOY_RUNNER != ''
    needs: build-and-push
    # Hosted runners cannot reach a local kind cluster. Set the repository
    # variable DEPLOY_RUNNER to a self-hosted runner label (e.g. "kind") that
    # runs on the machine hosting the cluster.
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    # GitHub Environments hold per-environment secrets and can require manual
    # approval (set it on `release`).
    environment: ${{ needs.build-and-push.outputs.namespace }}
    concurrency:
      group: deploy-${{ needs.build-and-push.outputs.namespace }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # KUBECONFIG_B64: base64 kubeconfig stored as an environment secret.
      # Written with 0600 and removed at the end; never echoed.
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          (umask 077; printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig")

      - name: Deploy
        env:
          NAMESPACE: ${{ needs.build-and-push.outputs.namespace }}
          TAG: ${{ needs.build-and-push.outputs.tag }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: ./scripts/deploy.sh

      - name: Smoke test
        run: |
          kubectl -n "${{ needs.build-and-push.outputs.namespace }}" exec deploy/backend -- \
            wget -qO- http://127.0.0.1:4000/api/health/ready

      # Automatic rollback if the rollout or smoke test failed.
      - name: Roll back on failure
        if: failure()
        run: |
          NS="${{ needs.build-and-push.outputs.namespace }}"
          kubectl -n "$NS" rollout undo deployment/backend || true
          kubectl -n "$NS" rollout undo deployment/frontend || true

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"

  rollback:
    name: Manual rollback
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.DEPLOY_RUNNER || 'ubuntu-latest' }}
    environment: ${{ inputs.rollback_namespace }}
    steps:
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
          (umask 077; printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig")

      - name: Roll back
        env:
          NS: ${{ inputs.rollback_namespace }}
          TAG: ${{ inputs.rollback_tag }}
        run: |
          REPO="${GITHUB_REPOSITORY,,}"
          if [ -n "$TAG" ]; then
            # Precise: pin both deployments to a known-good, previously pushed tag.
            kubectl -n "$NS" set image deployment/backend  backend="${REGISTRY}/${REPO}-backend:${TAG}"
            kubectl -n "$NS" set image deployment/frontend frontend="${REGISTRY}/${REPO}-frontend:${TAG}"
          else
            # Fast: revert to the previous ReplicaSet.
            kubectl -n "$NS" rollout undo deployment/backend
            kubectl -n "$NS" rollout undo deployment/frontend
          fi
          kubectl -n "$NS" rollout status deployment/backend --timeout=120s
          kubectl -n "$NS" rollout status deployment/frontend --timeout=120s

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$RUNNER_TEMP/kubeconfig"
